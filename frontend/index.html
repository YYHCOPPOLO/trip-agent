<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能旅行助手 · AI 个性化行程规划</title>
    <meta name="description" content="输入目的地、日期与偏好，AI 为你生成包含景点、路线地图、天气、住宿、餐饮与预算的完整旅行计划，支持编辑与导出图片/PDF。" />
    <meta name="theme-color" content="#f8f5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121826" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/images/hero.jpg" />
    <script>
      // 在渲染前应用主题,避免闪烁(与 @vueuse/core useDark 的存储键保持一致)
      (function () {
        try {
          var stored = localStorage.getItem('vueuse-color-scheme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || ((!stored || stored === 'auto') && prefersDark))
            document.documentElement.classList.add('dark')
        }
        catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
