[project]
name = "trip-agent-backend"
version = "1.0.0"
description = "智能旅行助手后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "google-search-results>=2.4.2",
    "openai>=3.19.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
]
ignore = [
    "E501", # 长字符串交给 ruff format，不单独报行宽
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
